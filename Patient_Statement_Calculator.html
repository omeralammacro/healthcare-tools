<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Statement Tool - MOPL</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .button-group {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      background: linear-gradient(to right, #27ae60, #2ecc71);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .btn:hover {
      background: linear-gradient(to right, #219150, #27ae60);
    }
    .btn-clear {
      background: linear-gradient(to right, #e74c3c, #c0392b);
    }
    .btn-clear:hover {
      background: linear-gradient(to right, #c0392b, #a93226);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #34495e;
      color: white;
    }
    .date-separator {
      background-color: #ecf0f1;
      font-weight: bold;
      border-top: 3px solid #2980b9;
    }
    .summary {
      margin-bottom: 30px;
    }
    .summary div {
      background: #f4f6f8;
      padding: 15px;
      border-left: 5px solid #3498db;
      margin-bottom: 10px;
      border-radius: 5px;
    }
    .total {
      text-align: center;
      font-size: 2rem;
      color: #2ecc71;
      font-weight: bold;
    }
    .mopl-comment {
      background: #f4f6f8;
      padding: 15px;
      border-left: 5px solid #9b59b6;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 30px;
      color: #2c3e50;
    }
    button.delete-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button.delete-btn:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Patient Statement Tool - MOPL</h1>

    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="billDate">
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="billType">
          <option value="Copay">Copay</option>
          <option value="Coinsurance">Coinsurance</option>
          <option value="Deductible">Deductible</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount</label>
        <input type="number" id="billAmount" step="0.01">
      </div>
    </div>

    <div class="button-group">
      <button class="btn" onclick="addBill()">Add Balance</button>
      <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
    </div>

    <h2>Balance History</h2>
    <div style="text-align: right; margin-bottom: 10px;">
      <label for="sortOrder"><strong>Sort by:</strong></label>
      <select id="sortOrder" onchange="updateTable(); updateSummary(); generateMoplComment();">
        <option value="desc">Latest to Oldest</option>
        <option value="asc">Oldest to Latest</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="billBody"></tbody>
    </table>

    <h2>Summary by Date</h2>
    <div class="summary" id="datewiseTotals"></div>

    <h2>Total Balances</h2>
    <p class="total" id="totalBalance">$0.00</p>

    <h2>MOPL Comment</h2>
    <div id="moplComment" class="mopl-comment">No patient Balance</div>
  </div>

  <script>
    let bills = [];

    window.onload = function () {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('billDate').value = today;
    };

    document.getElementById('billAmount').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addBill();
      }
    });

    function parseDateMMDDYYYY(dateStr) {
      const [month, day, year] = dateStr.split('/');
      return new Date(`${year}-${month}-${day}`);
    }

    function addBill() {
      const dateInput = document.getElementById('billDate').value;
      const type = document.getElementById('billType').value;
      const amount = parseFloat(document.getElementById('billAmount').value);

      if (!dateInput || isNaN(amount)) {
        alert("Please enter a valid date and amount.");
        return;
      }

      const [year, month, day] = dateInput.split("-");
      const formattedDate = `${month}/${day}/${year}`;

      bills.push({ date: formattedDate, type, amount });
      updateTable();
      updateSummary();
      generateMoplComment();

      document.getElementById('billAmount').value = '';
    }

    function deleteBill(index) {
      bills.splice(index, 1);
      updateTable();
      updateSummary();
      generateMoplComment();
    }

    function clearAll() {
      bills = [];
      updateTable();
      updateSummary();
      generateMoplComment();
      document.getElementById('billAmount').value = '';
    }

    function updateTable() {
      const body = document.getElementById('billBody');
      body.innerHTML = '';

      const grouped = {};
      bills.forEach((bill, index) => {
        if (!grouped[bill.date]) grouped[bill.date] = [];
        grouped[bill.date].push({ ...bill, index });
      });

      const sortOrder = document.getElementById('sortOrder').value;
      const sortedDates = Object.keys(grouped).sort((a, b) => {
        const dateA = parseDateMMDDYYYY(a);
        const dateB = parseDateMMDDYYYY(b);
        return sortOrder === 'desc' ? dateB - dateA : dateA - dateB;
      });

      sortedDates.forEach(date => {
        const separator = document.createElement('tr');
        separator.className = "date-separator";
        separator.innerHTML = `<td colspan="4">${date}</td>`;
        body.appendChild(separator);

        grouped[date].forEach(({ type, amount, index }) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td></td>
            <td>${type}</td>
            <td>$${amount.toFixed(2)}</td>
            <td><button class="delete-btn" onclick="deleteBill(${index})">Delete</button></td>
          `;
          body.appendChild(row);
        });
      });
    }

    function updateSummary() {
      const container = document.getElementById('datewiseTotals');
      container.innerHTML = '';
      let total = 0;
      const summary = {};

      bills.forEach(({ date, type, amount }) => {
        if (!summary[date]) summary[date] = {};
        if (!summary[date][type]) summary[date][type] = 0;
        summary[date][type] += amount;
        total += amount;
      });

      const sortOrder = document.getElementById('sortOrder').value;
      Object.keys(summary)
        .sort((a, b) => {
          const dateA = parseDateMMDDYYYY(a);
          const dateB = parseDateMMDDYYYY(b);
          return sortOrder === 'desc' ? dateB - dateA : dateA - dateB;
        })
        .forEach(date => {
          let html = `<div><strong>${date}</strong><ul>`;
          for (const [type, amt] of Object.entries(summary[date])) {
            html += `<li>${type}: $${amt.toFixed(2)}</li>`;
          }
          html += '</ul></div>';
          container.innerHTML += html;
        });

      document.getElementById('totalBalance').textContent = `$${total.toFixed(2)}`;
    }

    function generateMoplComment() {
      if (bills.length === 0) {
        document.getElementById('moplComment').innerText = "No patient Balance";
        return;
      }

      const BalanceByDate = {};

      bills.forEach(({ date, type, amount }) => {
        const normalizedType = type.toLowerCase() === 'coinsurance' ? 'coins' : type.toLowerCase();
                               type.toLowerCase() === 'deductible' ? 'ded' : type.toLowerCase();
        if (!BalanceByDate[date]) BalanceByDate[date] = {};
        if (!BalanceByDate[date][normalizedType]) BalanceByDate[date][normalizedType] = 0;
        BalanceByDate[date][normalizedType] += amount;
      });

      const sortedDates = Object.keys(BalanceByDate).sort((a, b) => parseDateMMDDYYYY(a) - parseDateMMDDYYYY(b));

      const commentParts = sortedDates.map(date => {
        const Balances = BalanceByDate[date];
        const entries = Object.entries(Balances).map(
          ([type, amt]) => `$${amt.toFixed(2)} of ${type}`
        );
        return `${entries.join(' & ')} Balance pending on ${date}`;
      });

      const finalComment = "Patient Balance available and statement uploaded. " + commentParts.join(", ");
      document.getElementById('moplComment').innerText = finalComment;
    }
  </script>
</body>
</html>
