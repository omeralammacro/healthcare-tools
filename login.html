<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Healthcare Tools Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 420px;
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}

.logo {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 20px;
  box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
}

.login-header h1 {
  color: #f1f5f9;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}

.login-header p {
  color: #94a3b8;
  font-size: 14px;
}

.login-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.tab-switcher {
  display: flex;
  background: #0f172a;
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 28px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn.active {
  background: #3b82f6;
  color: #fff;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  color: #f1f5f9;
  font-family: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
  outline: none;
}

.form-group input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.form-group input::placeholder {
  color: #475569;
}

.signup-field {
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 4px;
}

.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.error-msg {
  background: #7f1d1d33;
  border: 1px solid #991b1b;
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

.success-msg {
  background: #14532d33;
  border: 1px solid #166534;
  color: #86efac;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

.forgot-link {
  display: block;
  text-align: center;
  margin-top: 16px;
  color: #64748b;
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
}

.forgot-link:hover {
  color: #94a3b8;
}

.loading-spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.footer-note {
  text-align: center;
  margin-top: 24px;
  color: #475569;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo">+</div>
    <h1>Healthcare Tools Portal</h1>
    <p>Sign in to access your authorized tools</p>
  </div>

  <div class="login-card">
    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group signup-field" id="nameField">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required minlength="6" autocomplete="current-password">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
    </form>

    <a class="forgot-link" id="forgotLink" onclick="resetPassword()">Forgot password?</a>
  </div>

  <p class="footer-note">Secured with Firebase Authentication</p>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentMode = 'login';

function switchTab(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && mode === 'login') || (i === 1 && mode === 'signup'));
  });
  document.querySelectorAll('.signup-field').forEach(el => {
    el.style.display = mode === 'signup' ? 'block' : 'none';
  });
  document.getElementById('submitBtn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('forgotLink').style.display = mode === 'login' ? 'block' : 'none';
  hideMessages();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}

function setLoading(loading) {
  const btn = document.getElementById('submitBtn');
  btn.disabled = loading;
  if (loading) {
    btn.innerHTML = '<span class="loading-spinner"></span> Please wait...';
  } else {
    btn.textContent = currentMode === 'login' ? 'Sign In' : 'Create Account';
  }
}

async function handleAuth(e) {
  e.preventDefault();
  hideMessages();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const fullName = document.getElementById('fullName').value.trim();

  if (currentMode === 'signup' && !fullName) {
    showError('Please enter your full name.');
    return;
  }

  setLoading(true);

  try {
    if (currentMode === 'signup') {
      // Create account
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await cred.user.updateProfile({ displayName: fullName });

      // Create user doc in Firestore
      const isAdmin = email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      await db.collection('users').doc(cred.user.uid).set({
        email: email,
        name: fullName,
        role: isAdmin ? 'admin' : 'member',
        // Admin gets all tools, members get none until admin grants access
        tools: isAdmin ? TOOLS.map(t => t.id) : [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        status: isAdmin ? 'active' : 'pending'
      });

      if (isAdmin) {
        window.location.href = 'dashboard.html';
      } else {
        showSuccess('Account created! Please wait for admin to grant you access.');
        auth.signOut();
        switchTab('login');
      }
    } else {
      // Sign in
      const cred = await auth.signInWithEmailAndPassword(email, password);

      // Check if user has access
      const userDoc = await db.collection('users').doc(cred.user.uid).get();

      if (!userDoc.exists) {
        // Create user doc if missing (for admin email)
        const isAdmin = email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        await db.collection('users').doc(cred.user.uid).set({
          email: email,
          name: cred.user.displayName || email.split('@')[0],
          role: isAdmin ? 'admin' : 'member',
          tools: isAdmin ? TOOLS.map(t => t.id) : [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          status: isAdmin ? 'active' : 'pending'
        });
      }

      const userData = (await db.collection('users').doc(cred.user.uid).get()).data();

      if (userData.status === 'blocked') {
        showError('Your access has been revoked. Contact the administrator.');
        auth.signOut();
        setLoading(false);
        return;
      }

      window.location.href = 'dashboard.html';
    }
  } catch (err) {
    let msg = 'An error occurred. Please try again.';
    switch (err.code) {
      case 'auth/user-not-found': msg = 'No account found with this email.'; break;
      case 'auth/wrong-password': msg = 'Incorrect password.'; break;
      case 'auth/invalid-credential': msg = 'Invalid email or password.'; break;
      case 'auth/email-already-in-use': msg = 'An account with this email already exists.'; break;
      case 'auth/weak-password': msg = 'Password must be at least 6 characters.'; break;
      case 'auth/invalid-email': msg = 'Please enter a valid email address.'; break;
      case 'auth/too-many-requests': msg = 'Too many attempts. Please try again later.'; break;
    }
    showError(msg);
  }
  setLoading(false);
}

async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Enter your email address first, then click "Forgot password?"');
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    showSuccess('Password reset email sent! Check your inbox.');
  } catch (err) {
    showError('Could not send reset email. Check the email address.');
  }
}

// If already logged in, redirect
auth.onAuthStateChanged(user => {
  if (user) {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
